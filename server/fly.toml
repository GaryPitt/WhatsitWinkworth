# fly.toml app configuration file generated for whats-it-winkworth on 2026-06-02T15:47:06+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'whats-it-winkworth'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile'

[[mounts]]
  source = 'winkworth_data'
  destination = '/app/data'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
