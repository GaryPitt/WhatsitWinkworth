name: Fly Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: fly-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # Build context is the repo root so the root index.html can be baked
      # into the image as the homepage; app config lives in server/fly.toml.
      - run: flyctl deploy --remote-only --config server/fly.toml --dockerfile server/Dockerfile
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
